name: Update profile cards

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  push:
    branches: [master]
    paths:
      - '.github/workflows/profile-cards.yml'
  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # README_STATS_TOKEN: optional PAT (repo + read:user) to count private commits.
      # Falls back to GITHUB_TOKEN, which only sees public data.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate vttforge pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=vttforge&repo=vttforge&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-vttforge.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate agent-skills pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=fcsouza&repo=agent-skills&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-agent-skills.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate psi-pra-todos pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=fcsouza&repo=psi-pra-todos&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-psi-pra-todos.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate claude-impact-rj26 pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=fcsouza&repo=claude-impact-rj26&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-claude-impact-rj26.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pdf-character-sheet pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=fcsouza&repo=pdf-character-sheet&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-pdf-character-sheet.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate fome-zero pin
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: pin
          options: username=fcsouza&repo=fome-zero&description_lines_count=3&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515
          path: profile/pin-fome-zero.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@70dd50f921097927dc8314ac33a04b010a09924d # main (2026-09-14)
        with:
          options: user=${{ github.repository_owner }}&theme=radical&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git pull --rebase
          git push
